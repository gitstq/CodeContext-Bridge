[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecontext-bridge"
version = "1.0.0"
description = "🔄 A lightweight CLI tool to seamlessly migrate and sync project context across AI coding assistants"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "CodeContext Team", email = "hello@codecontext.dev"}
]
keywords = ["ai", "cli", "context", "claude", "codex", "cursor", "developer-tools", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Tools",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "pyyaml>=6.0.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.scripts]
ccb = "codecontext_bridge.cli:main"
codecontext-bridge = "codecontext_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/CodeContext-Bridge"
Repository = "https://github.com/gitstq/CodeContext-Bridge"
Issues = "https://github.com/gitstq/CodeContext-Bridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=codecontext_bridge --cov-report=term-missing"
